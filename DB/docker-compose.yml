version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - shared_network

  app_receiver:
    build: .
    ports:
      - "8082:80"
    environment:
      DB_HOST: db
    depends_on:
      - db
    networks:
      - shared_network

volumes:
  db_data:

networks:
  shared_network:
    external: true
